name: Format code

on:
  push:
    branches:
      - main
      - building/auth-onboarding
      - dashboard-refractor
      - "fix/**"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Format TypeScript and JavaScript
        run: npx --yes prettier@3.6.2 --write 'src/**/*.{ts,tsx,js,jsx}' 'backend/src/**/*.{ts,tsx,js,jsx}' '*.ts' '*.js'

      - name: Commit formatted code
        run: |
          if git diff --quiet; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src backend/src *.ts *.js
          git commit -m "refactor: code: format project files [skip ci]"
          git push origin ${{ github.ref_name }}
